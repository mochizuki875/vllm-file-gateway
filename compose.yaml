services:
  gateway:
    build:
      context: .
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      VLLM_MODEL: "${VLLM_MODEL:?VLLM_MODEL is required}"
      VLLM_BASE_URL: "${VLLM_BASE_URL:?VLLM_BASE_URL is required}"
      GATEWAY_AUTH_REQUIRED: "${GATEWAY_AUTH_REQUIRED:-false}"
      GATEWAY_API_KEY: "${GATEWAY_API_KEY:-}"
      VLLM_API_KEY: "${VLLM_API_KEY:-}"
      GATEWAY_DATA_DIR: /var/lib/file-gateway
      FILE_TTL_SECONDS: "${FILE_TTL_SECONDS:-21600}"
      MAX_FILE_BYTES: "${MAX_FILE_BYTES:-52428800}"
      MAX_DOCUMENT_PAGES: "${MAX_DOCUMENT_PAGES:-20}"
      MAX_DOCUMENT_IMAGES: "${MAX_DOCUMENT_IMAGES:-8}"
      REQUEST_TIMEOUT_SECONDS: "${REQUEST_TIMEOUT_SECONDS:-300}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped