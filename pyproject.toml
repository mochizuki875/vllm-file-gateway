[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-file-gateway"
version = "0.1.0"
description = "Document file gateway for vLLM multimodal APIs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "vllm-file-gateway contributors" },
]
keywords = ["document", "fastapi", "gateway", "openai", "vllm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "document-image-renderer @ https://github.com/mochizuki875/document-image-renderer/archive/refs/tags/v0.1.0.tar.gz",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "openpyxl>=3.1,<4",
    "pydantic-settings>=2.10,<3",
    "PyMuPDF>=1.26,<2",
    "python-docx>=1.2,<2",
    "python-multipart>=0.0.20,<1",
    "python-pptx>=1.0,<2",
    "SQLAlchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
example = [
    "openai>=1.109,<2",
]
test = [
    "httpx2>=2.12,<3",
]

[project.urls]
Homepage = "https://github.com/mochizuki875/vllm-file-gateway"
Repository = "https://github.com/mochizuki875/vllm-file-gateway"
Issues = "https://github.com/mochizuki875/vllm-file-gateway/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]